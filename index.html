<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenReason - E-commerce de produtos sustentáveis</title>
    <!--Importando a fonte Poppins (será usada ao decorrer do projeto)-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!--Importando os ícones-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!--Importando o CSS do Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
        <div class="container">
            <a class="navbar-brand text-success fw-bold fs-3" href="#">
                <i class="fa-solid fa-leaf"></i> GreenReason
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacao" aria-controls="menuNavegacao" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuNavegacao">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Categorias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contatos</a>
                    </li>
                </ul>
                
                <form class="d-flex" role="search">
                    <button class="btn btn-outline-success d-flex align-items-center gap-2" type="button">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Carrinho (0)</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>
    <main class="container mt-4">
        <div id="carrosselDestaques" class="carousel slide" data-bs-ride="carousel">
            
            <!-- Indicadores (os tracinhos na parte de baixo da imagem) -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carrosselDestaques" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carrosselDestaques" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carrosselDestaques" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            
            <!-- Imagens e Textos do Carrossel -->
            <div class="carousel-inner rounded-3 shadow">
                
                <div class="carousel-item active">
                    <img src="https://revistavertical.com.br/wp-content/uploads/2025/04/moda-sustentavel-1536x480.jpg" class="d-block w-100" alt="Moda Sustentável">
                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
                        <h5>Roupas e Acessórios</h5>
                        <p>Vista-se com propósito. Conheça nossa nova coleção orgânica.</p>
                    </div>
                </div>
                
                <!-- Slide 2 -->
                <div class="carousel-item">
                    <img src="https://www.suafranquia.com/storage/views/sources/images/conteudo/principal/RF99XQaPglFsZETeIm18soYqBZXp57aFAswbqyJG.jpg"  class="d-block w-100" alt="Beleza e Cuidados">
                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
                        <h5>Beleza e Cuidados</h5>
                        <p>Produtos 100% naturais que cuidam de você e do planeta.</p>
                    </div>
                </div>
                
                <!-- Slide 3 -->
                <div class="carousel-item">
                    <img src="casa.jpeg" class="d-block w-100" alt="Casa e Tecnologia Verde">
                    <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded">
                        <h5>Itens para Casa & Tecnologia Verde</h5>
                        <p>Transforme seu lar com sustentabilidade e inovação.</p>
                    </div>
                </div>
                
            </div>
            
            <!-- Controles (Setas de Voltar e Avançar) -->
            <button class="carousel-control-prev" type="button" data-bs-target="#carrosselDestaques" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carrosselDestaques" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Próximo</span>
            </button>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
